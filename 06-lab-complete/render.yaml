services:
  - type: keyvalue
    name: agent-redis
    plan: free
    ipAllowList: []

  - type: web
    name: production-ai-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
      - key: DAILY_BUDGET_USD
        value: "5.0"
